# Rubrique contre-surveillance : documentaire, pas opérationnelle.
# Faits et cadres légaux à vérifier aux sources ; renvois vers les guides de référence.
sections:
  - id: paysage
    title: Le paysage de la surveillance des foules
    items:
      - {name: Vidéosurveillance, text: "Caméras fixes ou mobiles (y compris caméras-piétons des policiers). Cadres légaux nationaux ; en Espagne, la LO 4/2015 sur la sécurité citoyenne ; en France, le Code de la sécurité intérieure."}
      - {name: Reconnaissance faciale, text: "Identification automatique de personnes sur images. Le règlement européen sur l'IA (AI Act) encadre fortement l'identification biométrique à distance en temps réel dans l'espace public par les forces de l'ordre, avec des exceptions limitées."}
      - {name: Lecture automatique de plaques (LAPI/ANPR), text: "Caméras lisant les plaques d'immatriculation pour recouper des fichiers de véhicules."}
      - {name: IMSI-catchers, text: "Fausses antennes-relais captant des identifiants de téléphones à proximité ; leur usage est encadré, et parfois contesté, selon les pays."}
      - {name: Drones, text: "Surveillance aérienne des cortèges ; l'usage policier a fait l'objet de décisions de justice en France (limitations par le Conseil d'État / CNIL)."}
      - {name: Nasses / encerclements (kettling), text: "Encerclement des manifestants. La Cour européenne des droits de l'homme (Austin c. Royaume-Uni, 2012) a jugé qu'une nasse proportionnée n'est pas forcément une privation de liberté ; la pratique reste débattue."}
      - {name: Fichage, text: "Fichiers de renseignement ou de police (ex. FPR, fichiers d'antécédents). Droits d'accès, de rectification et de contrôle selon les pays."}
  - id: masque
    title: Pourquoi on se couvre le visage en manifestation
    items:
      - {name: Effet dissuasif, text: "Être identifiable peut décourager l'exercice du droit de manifester : crainte d'un fichage, de représailles professionnelles ou de poursuites."}
      - {name: Erreurs et fichages, text: "Les systèmes d'identification peuvent se tromper, et un fichage peut être durable ; c'est un argument central des organisations de défense des libertés."}
      - {name: Histoire, text: "Le masquage fait partie du répertoire militant depuis longtemps (bloc noir, foulards, masques symboliques)."}
      - {name: Cadre juridique, text: "Beaucoup de pays encadrent ou interdisent la dissimulation du visage en manifestation (en France, art. 431-9-1 du Code pénal depuis 2019 ; en Espagne, sanctions administratives de la LO 4/2015). Les ONG de libertés critiquent ces lois."}
  - id: hygiene
    title: Hygiène numérique de base (renvois vers guides de référence)
    items:
      - {name: Principe, text: "Réduire son empreinte numérique protège aussi ses proches. Ces ressources, rédigées par des organisations reconnues, expliquent le pourquoi et le comment mieux que ne le ferait un résumé ici."}
resources:
